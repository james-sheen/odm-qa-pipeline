# Two jobs, and the split is the point.
#
# `suite` installs this package and nothing else. It has no runtime dependencies
# on purpose -- that is what lets it report a gate which did not run, since
# importing a gate cannot be the prerequisite for noticing the gate is missing.
# If that ever stops being true, this job fails on the import rather than
# quietly acquiring a dependency nobody chose.
#
# `composition` installs the whole suite and actually runs three of the four
# gates against a mock BMC. Everything in `suite` tests this package in
# isolation, which is not enough: the product is a composition, and a
# composition can be wrong while every part of it is right.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just the one this workflow
  # happened to name. `>=3.10` is a claim about five of them and exactly one was
  # ever run. In a sibling repository that gap hid two end-to-end tests that had
  # been erroring since 3.13, and every host this family is deployed on runs
  # 3.14.
  versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: |
          set -euo pipefail
          python3 -m pip install --quiet ".[dev]"
          python3 -m pytest tests/ -q

  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message step needs the commits in this push,
          # and the default depth of 1 would leave it checking only the tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this package alone
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[dev]'

      - name: It really does have no runtime dependencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from importlib.metadata import requires
          runtime = [r for r in (requires("odm-qa-pipeline") or [])
                     if "extra ==" not in r]
          assert not runtime, f"runtime dependencies appeared: {runtime}"
          print("  none, as declared")
          PY

      - name: The suite
        run: python3 -m pytest tests/ -q

      - name: The gates and the pins are printable
        run: |
          set -euo pipefail
          odm-qa-pipeline gates
          odm-qa-pipeline pins

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED

      - name: The same suite, from the sdist this tree builds
        # THE ARTIFACT, NOT THE CHECKOUT. A packager or a reviewer runs the suite
        # from the sdist, and on 2026-09-26 five of the nine sdists in this family
        # could not: each carried tests/ without files those tests import or open,
        # so collection stopped and nothing ran, while twine, the metadata and a
        # clean wheel install all passed over it. So the suite runs again from the
        # unpacked sdist and from `git archive HEAD`, neither with a `.git`, and
        # every test must answer the same on both sides: a test that needs a
        # repository skips on both, and a file the sdist leaves out cannot hide.
        # The package is reinstalled from the sdist first, so what imports is
        # what a wheel built from the artifact would install.
        env:
          REINSTALL: "yes"
          PRE: ""
        run: |
          set -euo pipefail
          T="${RUNNER_TEMP:-/tmp}/sdist-check"
          rm -rf "${T}" && mkdir -p "${T}/tree" "${T}/unpacked"
          git archive HEAD | tar -x -C "${T}/tree"
          python3 -m pip install --quiet build
          python3 -m build --sdist --outdir "${T}/dist" . > "${T}/build.log"
          tar -xzf "${T}"/dist/*.tar.gz -C "${T}/unpacked" --strip-components=1
          test ! -e "${T}/unpacked/.git"
          if [ "${REINSTALL}" = yes ]; then
            (cd "${T}/unpacked" && python3 -m pip install --quiet --no-deps --force-reinstall .)
          fi
          for side in tree unpacked; do
            (cd "${T}/${side}" && { [ -z "${PRE}" ] || python3 ${PRE} > /dev/null; } \
               && python3 -m pytest tests/ -q -p no:cacheprovider --junitxml="${T}/${side}.xml") \
               > "${T}/${side}.log" 2>&1 || true
          done
          python3 - "${T}" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          T = pathlib.Path(sys.argv[1])
          def outcomes(side):
              report = T / f"{side}.xml"
              if not report.is_file():
                  print((T / f"{side}.log").read_text()[-3000:])
                  sys.exit(f"::error::the {side} run wrote no report")
              out = {}
              for case in ET.parse(report).getroot().iter("testcase"):
                  kinds = {child.tag for child in case}
                  out[f"{case.get('classname')}::{case.get('name')}"] = (
                      "failed" if "failure" in kinds else "error" if "error" in kinds
                      else "skipped" if "skipped" in kinds else "passed")
              return out
          tree, sdist = outcomes("tree"), outcomes("unpacked")
          if not tree:
              sys.exit("::error::the tracked tree collected nothing, so there is nothing to compare")
          broken = sorted(k for k, v in sdist.items() if v in ("failed", "error"))
          missing = sorted(set(tree) - set(sdist))
          extra = sorted(set(sdist) - set(tree))
          changed = sorted(k for k in set(tree) & set(sdist) if tree[k] != sdist[k])
          for label, keys in (("fails when run from the sdist", broken),
                              ("is in the tree and not in the sdist", missing),
                              ("is in the sdist and not in the tree", extra),
                              ("answers differently from the sdist", changed)):
              for key in keys[:25]:
                  print(f"::error::{key} {label} (tree: {tree.get(key)}, sdist: {sdist.get(key)})")
          if broken or missing or extra or changed:
              print((T / "unpacked.log").read_text()[-3000:])
              sys.exit(1)
          count = lambda outcome: sum(1 for v in sdist.values() if v == outcome)
          print(f"  the sdist answers exactly as the tracked tree does: {len(sdist)} tests, "
                f"{count('passed')} passed, {count('skipped')} skipped")
          PY

  composition:
    runs-on: ubuntu-latest
    env:
      ODM_QA_REQUIRE_COMPOSITION: "1"
      # The CHECKOUT, not a directory inside it: the scenarios are found by
      # their format marker wherever they sit, so this keeps working when they
      # move. The old value still works for the same reason.
      ODM_QA_SCENARIOS: "qa-orchestrator"
      # This job already installs every gate's requirements, so the DMTF
      # validators are here -- which makes this the one place the gate-1 reader
      # can be checked against a file the publisher's own code wrote. Required,
      # so it cannot quietly become a skip.
      ODM_QA_REQUIRE_DMTF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The whole suite, installed the way the manifest says
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -e '.[dev]'
          # EVERY gate, in ONE resolution. This installed a gate at a time
          # until 2026-09-09, which is a separate resolution per gate -- and a
          # later one is free to move a pin an earlier one had just placed.
          # Both installs succeed, so nothing goes red; the suite below simply
          # runs against an environment this manifest does not describe.
          # `odm-cert-generator` 0.2.2 moved the referee two minor versions
          # that way. The gate list is still read from the tool rather than
          # written here, because a gate added to the manifest has to arrive
          # here without anyone remembering to add it.
          flags=$(odm-qa-pipeline gates --json | python3 -c \
                  'import json,sys; print(" ".join("--gate " + g["name"] for g in json.load(sys.stdin)))')
          odm-qa-pipeline pins ${flags} > requirements-all.txt
          sed 's/^/    /' requirements-all.txt
          # A floor naming a version the index has not served YET and a floor
          # naming a version that does not exist AT ALL look identical to pip,
          # and they are opposite facts. The first resolves itself minutes
          # after a coordinated release; the second is the defect this job is
          # here to catch. Retry a bounded number of times, say out loud which
          # one is being assumed, and still fail if it never resolves.
          #
          # This is not hypothetical: the 0.2.0 release went red here because
          # PyPI's JSON API served odm-cert-generator 0.2.0 while the simple
          # index pip reads still listed 0.1.3.
          for attempt in 1 2 3 4 5 6; do
            if python3 -m pip install --quiet -r requirements-all.txt; then
              break
            fi
            if [ "${attempt}" = 6 ]; then
              echo "::error::a requirement above never resolved. The index has had six tries across five minutes, so this is not lag -- either the manifest names a version that is not published, or two of these pins cannot hold at once."
              exit 1
            fi
            echo "not resolvable yet; assuming the index has not caught up (attempt ${attempt} of 6), retrying in 50s"
            sleep 50
          done

      - name: The orchestrator's scenarios, from its repository
        # Cloned rather than vendored: a copy here would be a second set of
        # scenarios and the two would drift.
        run: git clone --depth 1 https://github.com/james-sheen/qa-orchestrator.git

      - name: Everything, with the composition test required
        run: python3 -m pytest tests/ -q

      - name: A scenario runs from this workspace, not only from its own repository
        # The defect this job found the first time it ran: scenarios resolved
        # their config against the working directory, so they worked from the
        # orchestrator's root and nowhere else -- including here, which is
        # exactly where a customer's pipeline runs them from.
        run: odm-qa-pipeline scenarios qa-orchestrator
